<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 蓝色鲸鱼 + 思维网络 = 数字中枢 -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e"/>
  <!-- 鲸鱼身体 -->
  <ellipse cx="30" cy="34" rx="18" ry="12" fill="#4a90d9"/>
  <ellipse cx="30" cy="34" rx="14" ry="9" fill="#6bb5ff"/>
  <!-- 鲸鱼尾巴 -->
  <path d="M12,34 Q4,26 8,22 Q12,28 12,34Z" fill="#4a90d9"/>
  <path d="M12,34 Q4,42 8,46 Q12,40 12,34Z" fill="#4a90d9"/>
  <!-- 眼睛 -->
  <circle cx="40" cy="30" r="2.5" fill="#1a1a2e"/>
  <circle cx="41" cy="29" r="0.8" fill="#fff"/>
  <!-- 喷水 -->
  <path d="M48,22 Q52,14 50,8" stroke="#a0d2ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 网络节点 -->
  <circle cx="20" cy="16" r="2" fill="#ff6b6b"/>
  <circle cx="50" cy="24" r="2" fill="#ffd93d"/>
  <circle cx="22" cy="50" r="2" fill="#6bff6b"/>
  <circle cx="50" cy="48" r="2" fill="#ff6bd9"/>
  <!-- 连接线 -->
  <line x1="32" y1="26" x2="20" y2="16" stroke="#ffffff33" stroke-width="0.8"/>
  <line x1="32" y1="28" x2="50" y2="24" stroke="#ffffff33" stroke-width="0.8"/>
  <line x1="30" y1="40" x2="22" y2="50" stroke="#ffffff33" stroke-width="0.8"/>
  <line x1="34" y1="40" x2="50" y2="48" stroke="#ffffff33" stroke-width="0.8"/>
</svg>